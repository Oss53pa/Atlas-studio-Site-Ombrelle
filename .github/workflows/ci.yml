name: CI

# Contrôles sur chaque PR vers main. Plus de seconde exécution après la fusion :
# le code fusionné est celui qui vient d'être contrôlé dans la PR. Le quota
# gratuit de GitHub Actions est partagé par tous les dépôts privés du compte.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
